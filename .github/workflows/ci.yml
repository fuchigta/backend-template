name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src/

      - name: Lizard complexity
        run: uv run lizard src/ --CCN 8 --length 50 --arguments 5

      - name: Cccc complexity
        uses: moznion/cccc-action@v1.1.2
        with:
          version: v1.8.6
          path: src

      - name: Detect secrets
        run: git ls-files -z -- . ':!tests/' | xargs -0 uv run detect-secrets-hook --baseline .secrets.baseline

      - name: Pytest
        run: uv run pytest

      - name: Schema contract tests
        run: uv run python schema_test.py

      - name: Pip audit
        run: uv run pip-audit

  # Mutation testing (cosmic-ray, configured in cosmic-ray.toml).
  # Pull requests: only mutants on lines changed relative to origin/master are
  # run, and any surviving mutant fails the job.
  # Pushes to master: every mutant in src/ is run (about 4-5 minutes) and the
  # result is reported in the job summary and as an HTML artifact. The job
  # fails if more mutants survive than MAX_SURVIVING_MUTANTS (below).
  mutation:
    runs-on: ubuntu-latest
    env:
      SESSION: .cache/cosmic-ray.sqlite
      # Ratchet for the full run on master: the number of known equivalent
      # mutants that survive on purpose. All 9 are in src/api/main.py; see
      # "Known survivors, not excluded (9)" in PR #7 for each mutant and why
      # it is equivalent. When a code or test change removes one of them,
      # lower this number in the same change so the gate tightens. Never
      # raise it to let a new survivor through; kill the mutant instead.
      MAX_SURVIVING_MUTANTS: 9
    steps:
      - uses: actions/checkout@v7
        with:
          # cr-filter-git diffs against origin/master, so it must be fetched.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Mutation baseline (tests pass without mutations)
        run: uv run cosmic-ray baseline cosmic-ray.toml

      - name: Generate mutants
        run: |
          mkdir -p "$(dirname "$SESSION")"
          uv run cosmic-ray init cosmic-ray.toml "$SESSION" --force

      - name: Skip lines marked with pragma no mutate
        run: uv run cr-filter-pragma "$SESSION"

      - name: Limit to lines changed from master
        if: github.event_name == 'pull_request'
        run: uv run cr-filter-git --config cosmic-ray.toml "$SESSION"

      - name: Run mutants
        run: uv run cosmic-ray exec cosmic-ray.toml "$SESSION"

      - name: Report surviving mutants
        if: always()
        run: |
          {
            echo '## Mutation testing'
            echo '```'
            uv run cr-report "$SESSION" --surviving-only --show-diff
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          uv run cr-html --skip-success "$SESSION" > mutation-report.html

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mutation-report
          path: mutation-report.html

      - name: Fail on surviving mutants
        if: github.event_name == 'pull_request'
        # cr-rate treats --fail-over 0 as "no limit", so use the smallest
        # positive rate: any surviving mutant in the diff fails the job.
        run: uv run cr-rate --fail-over 0.001 "$SESSION"

      - name: Fail on more survivors than known equivalent mutants
        if: github.event_name == 'push'
        run: |
          survived=$(uv run cosmic-ray dump "$SESSION" \
            | jq -s '[.[] | select(.[1].test_outcome == "survived")] | length')
          echo "Surviving mutants: $survived (limit: $MAX_SURVIVING_MUTANTS)"
          if [ "$survived" -gt "$MAX_SURVIVING_MUTANTS" ]; then
            echo "::error::$survived mutants survived, more than the $MAX_SURVIVING_MUTANTS known equivalent mutants. Kill the new survivors (see the job summary)."
            exit 1
          fi
